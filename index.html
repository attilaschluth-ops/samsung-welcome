<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bienvenue • Honay-Sorgatinat</title><style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;background:linear-gradient(115deg,rgba(8,23,31,.78),rgba(10,25,35,.38)),url('https://images.unsplash.com/photo-1516483638261-f4dbaf036963?w=1920&q=85') center/cover fixed #172c38;display:flex;align-items:center;justify-content:center}.wrap{width:min(94vw,1600px);padding:5vh 2vw}.eyebrow{font-size:clamp(15px,1.6vw,25px);letter-spacing:.38em;text-transform:uppercase;color:#f3d6a4}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(52px,7vw,118px);line-height:1.03;margin:20px 0}.subtitle{font-size:clamp(19px,2vw,31px);opacity:.93}.cards{display:grid;grid-template-columns:1fr 1.7fr;gap:20px;margin-top:6vh}.card{background:rgba(10,25,34,.69);border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:25px 30px;backdrop-filter:blur(10px)}.label{letter-spacing:.17em;text-transform:uppercase;font-size:16px;color:#f3d6a4}.value{font-size:clamp(42px,5vw,76px);margin:18px 0 6px}.small{opacity:.8;font-size:16px}.forecast{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:23px}.day{text-align:center;border-left:1px solid #ffffff30;padding:4px}.day:first-child{border:0}.day strong{display:block;font-size:19px;margin-bottom:14px}.day .icon{font-size:36px}.day .temp{font-size:20px;margin-top:12px}.footer{margin-top:4vh;opacity:.8;font-size:15px}.notice{color:#f5d7a2;font-size:14px;margin-top:8px}@media(max-width:760px){.cards{grid-template-columns:1fr}.card{padding:20px}.forecast{gap:0}.day strong{font-size:13px}.day .icon{font-size:24px}.day .temp{font-size:14px}}
</style></head><body><main class="wrap"><div class="eyebrow">Colmar · Alsace</div><h1>Bienvenue<br>chez vous.</h1><div class="subtitle">Nous vous souhaitons un merveilleux séjour à <strong>Honay-Sorgatinat</strong>.</div><section class="cards"><div class="card"><div class="label">Température intérieure</div><div class="value" id="inside">— °C</div><div class="small">Salon · Homey</div><div class="notice" id="indoor-note">Connexion Homey à configurer</div></div><div class="card"><div class="label">Météo à Colmar · 5 jours</div><div class="forecast" id="forecast"><div>Chargement de la météo…</div></div><div class="small" id="updated"></div></div></section><div class="footer" id="clock"></div></main><script>
// Public GitHub Pages must never contain Homey access tokens or passwords.
// A secure server-side integration will be added after the display test.
const days=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
function weatherIcon(code){if(code===0)return '☀️';if([1,2].includes(code))return '🌤️';if(code===3)return '☁️';if([45,48].includes(code))return '🌫️';if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))return '🌧️';if([71,73,75,77,85,86].includes(code))return '❄️';if([95,96,99].includes(code))return '⛈️';return '🌤️'}
async function refreshWeather(){try{const url='https://api.open-meteo.com/v1/forecast?latitude=48.0794&longitude=7.3585&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FParis&forecast_days=5';const r=await fetch(url);if(!r.ok)throw Error('weather');const j=await r.json();document.getElementById('forecast').innerHTML=j.daily.time.map((date,i)=>{const d=new Date(date+'T12:00:00');return `<div class="day"><strong>${days[d.getDay()]}</strong><div class="icon">${weatherIcon(j.daily.weather_code[i])}</div><div class="temp">${Math.round(j.daily.temperature_2m_max[i])}° / ${Math.round(j.daily.temperature_2m_min[i])}°</div></div>`}).join('');document.getElementById('updated').textContent='Prévisions actualisées automatiquement';}catch(e){document.getElementById('forecast').textContent='Prévisions temporairement indisponibles.'}}
function clock(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date())}clock();setInterval(clock,30000);refreshWeather();setInterval(refreshWeather,30*60*1000);
</script></body></html>
