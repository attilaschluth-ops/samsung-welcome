</style></head><body><div class="stage"><div class="clock"><div id="date" class="date">—</div><div id="time" class="time">—</div></div><div class="panel indoor"><div class="heading">Indoor temperature</div><div id="inside" class="reading">— °C</div><div class="caption">Living room · Homey</div></div><div class="panel weather"><div class="heading">Weather in Colmar</div><div id="current" class="reading">Loading…</div><div id="condition" class="caption">Live weather</div></div><div class="panel forecast"><div class="heading">5-day forecast</div><div id="days" class="days"></div><div id="status" class="status">Waiting for weather…</div></div></div><script>
// No secret Homey credentials should ever be placed in a public GitHub page.
// To activate indoor temperature, supply a publicly readable, non-sensitive HTTPS endpoint returning {"temperature":21.5}.
var HOMEY_TEMPERATURE_URL='';
var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function symbol(c){if(c===0)return '☀';if(c<=2)return '🌤';if(c===3)return '☁';if(c===45||c===48)return '🌫';if((c>=51&&c<=67)||(c>=80&&c<=82))return '🌧';if((c>=71&&c<=77)||c===85||c===86)return '❄';if(c>=95)return '⛈';return '🌤'}
function label(c){if(c===0)return 'Sunny';if(c<=2)return 'Partly cloudy';if(c===3)return 'Cloudy';if(c===45||c===48)return 'Foggy';if((c>=51&&c<=67)||(c>=80&&c<=82))return 'Rain';if((c>=71&&c<=77)||c===85||c===86)return 'Snow';if(c>=95)return 'Thunderstorms';return 'Variable'}
function request(url,cb){var x=new XMLHttpRequest();x.open('GET',url,true);x.timeout=12000;x.onload=function(){if(x.status>=200&&x.status<300){try{cb(null,JSON.parse(x.responseText))}catch(e){cb(e)}}else cb(Error('HTTP '+x.status))};x.onerror=function(){cb(Error('network'))};x.ontimeout=function(){cb(Error('timeout'))};x.send()}
function tick(){var d=new Date(),opts={timeZone:'Europe/Paris'};document.getElementById('date').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);document.getElementById('time').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
function weather(){var url='https://api.open-meteo.com/v1/forecast?latitude=48.0794&longitude=7.3585&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FParis&forecast_days=5&_='+Date.now();request(url,function(err,j){if(err||!j.current||!j.daily){document.getElementById('status').textContent='Weather unavailable · retrying';document.getElementById('current').textContent='— °C';return}var c=j.current;document.getElementById('current').textContent=symbol(c.weather_code)+' '+Math.round(c.temperature_2m)+' °C';document.getElementById('condition').textContent=label(c.weather_code);var out='';for(var i=0;i<Math.min(5,j.daily.time.length);i++){var d=new Date(j.daily.time[i]+'T12:00:00');out+='<div class="day"><div class="day-name">'+days[d.getDay()]+'<br>'+d.getDate()+'</div><div class="icon">'+symbol(j.daily.weather_code[i])+'</div><div class="temp">'+Math.round(j.daily.temperature_2m_max[i])+'° / '+Math.round(j.daily.temperature_2m_min[i])+'°</div></div>'}document.getElementById('days').innerHTML=out;document.getElementById('status').textContent='Updated: '+new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit'}).format(new Date())})}
function indoor(){if(!HOMEY_TEMPERATURE_URL)return;request(HOMEY_TEMPERATURE_URL+(HOMEY_TEMPERATURE_URL.indexOf('?')<0?'?':'&')+'_='+Date.now(),function(err,j){if(!err&&j&&typeof j.temperature==='number')document.getElementById('inside').textContent=j.temperature.toFixed(1)+' °C';else document.getElementById('inside').textContent='— °C'})}
tick();weather();indoor();setInterval(tick,30000);setInterval(weather,1800000);setInterval(indoor,60000);
</script></body></html>
